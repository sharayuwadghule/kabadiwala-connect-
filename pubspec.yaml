name: kabadiwala_connect
description: Flutter port of the Kabadiwala Connect SIH 2026 prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  connectivity_plus: ^6.1.4
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  geolocator: ^13.0.2
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kabadiwala_connect_logo.png
